name: Update contributors

# Keeps app/src/main/assets/contributors.json and the bundled avatars current, so the
# Information page credits everyone without anyone having to remember to update a list.
#
# It runs here rather than during the app build on purpose: the output is committed source,
# and regenerating it on every build would dirty the working tree whenever someone changed
# their GitHub avatar, and would make offline builds fail.
#
# GITHUB_TOKEN gives 1000 requests/hour, so the 60/hour unauthenticated limit is irrelevant.

on:
  schedule:
    # Weekly. Contributor lists do not move fast enough to warrant more.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the contributor list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributors.py

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update the bundled contributor list
          title: Update the bundled contributor list
          body: |
            Regenerated by `scripts/fetch_contributors.py`.

            Ordering is recency-weighted contribution volume, so it moves as people
            come and go. Avatars are refreshed at the same time.
          branch: chore/update-contributors
          delete-branch: true
          add-paths: |
            app/src/main/assets/contributors.json
            app/src/main/assets/contributors/
