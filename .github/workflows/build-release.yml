name: Generate APK (Release)
env:
  # The name of the main module repository
  main_project_module: app
  # The name of the App
  app_name: OpenTagViewer
  ALIAS: upload

on:
  release:
    types: published

# Every job states what it needs below; nothing gets more than that by default.
permissions: {}

# **The release key never shares a job with the build.**
#
# Building runs a great deal of code nobody here wrote or reviewed: Gradle plugins and every Maven
# artifact they pull, pip's dependency tree for the bridge tests, Chaquopy's own pip install of
# FindMy.py's dependencies, and the actions themselves. Any one of those, compromised, could read a
# keystore sitting on the same disk, or leave something behind in ~/.gradle to catch the passwords
# when a later step handed them over. And this app is sideloaded, with no Play App Signing behind
# it: a stolen key signs updates that install over every existing install without a warning.
#
# So the work is split three ways:
#
# - `build` builds and tests, and produces the release APK *unsigned*. It never sees the key or its
#   passwords. app/build.gradle.kts leaves a release unsigned when no keystore is present.
# - `sign` is the only job that does. It checks nothing out and runs nothing from the repository,
#   only the Android SDK's own apksigner and zipalign from the runner image, on the APK `build`
#   uploaded. It writes the keystore to the runner's temp directory and deletes it straight after,
#   and it checks the result is signed by the key every earlier release was signed by.
# - `publish` attaches the signed APK to the release, with this run's own token.
#
# Do not fold them back into one job to save an artifact round-trip. That is the arrangement this
# replaced.
jobs:
  build:
    environment: 'Android Build Release'
    runs-on: ubuntu-latest

    # Read-only: this job publishes nothing. Its environment is only for MAPS_API_KEY, which ends up
    # inside the APK anyway. GitHub hands a job the secrets that job references and no others, so the
    # signing secrets in the same environment do not reach this runner.
    permissions:
      contents: read

    outputs:
      app_version: ${{ steps.extract_version.outputs.APP_VERSION }}
      release_artifact: ${{ steps.names.outputs.release_artifact }}

    # Only run this for 'android-app-v<whatever>' tags!
    if: |
      github.event_name == 'release'
      && (github.event.release.prerelease == true || github.event.release.published_at != null)
      && startsWith(github.event.release.tag_name, 'android-app-v')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing rewrites versionName from the tag: it is what the app reports about itself in
      # Settings and in bug reports, and it is baked into the APK. So a tag that disagrees
      # with app/build.gradle.kts publishes an APK calling itself the old version, under a
      # release page claiming the new one, and nothing anywhere says so.
      #
      # This replaces parsing the tag by hand. The version now comes from the source and the
      # tag only has to agree with it, which is the same arrangement the macOS exporter has
      # used since scripts/release_version.py was introduced. It runs before the Gradle build,
      # so a mismatch costs seconds rather than a full signed build.
      - name: Check the release tag matches the version in the source
        id: extract_version
        run: |
          APP_VERSION="$(python3 scripts/release_version.py --kind android --tag "${{ github.ref }}")"
          echo "Tag and source agree on version: $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      # The signed APK is uploaded by `sign`, under the same name this job always used. Worked out
      # here so the date in it is the one the build started on, as it always was.
      - name: Name the release artifact
        id: names
        run: echo "release_artifact=$date_today - $app_name - $repository_name - APK(s) release generated" >> "$GITHUB_OUTPUT"

      - name: Set Up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew


      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inject secrets.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > secrets.properties

      # No stub wheel to validate any more: it is generated from app/stubs/unicorn/ by
      # generateUnicornStubWheel during the build, rather than being checked in.

      # A release is the worst time to discover a locale is missing a string, since the
      # fallback is silent: those users simply get English.
      - name: Check every locale has every string
        run: python3 scripts/add_strings.py --check

      - name: Run gradle tests
        run: ./gradlew test

      # Covers app/src/main/python, the module Chaquopy packages into the APK.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Chaquopy bridge test dependencies
        run: python -m pip install -r app/src/test/python/requirements.txt

      - name: Run Chaquopy bridge tests
        run: python -m pytest app/src/test/python -v

      - name: Build gradle project
        run: ./gradlew build -x lint

      - name: Build APK Debug
        run: |
          ./gradlew assembleDebug
          # rename debug build
          mv ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk ${{ env.main_project_module }}/build/outputs/apk/debug/${{ env.app_name }}-${{ steps.extract_version.outputs.APP_VERSION }}-debug.apk

      # Unsigned, because there is no keystore here to sign it with. AGP names that output
      # app-release-unsigned.apk, so if a keystore ever did turn up in this job the `mv` would fail
      # rather than quietly shipping whatever it had signed.
      - name: Build APK Release (unsigned)
        run: |
          ./gradlew assembleRelease
          mv "$main_project_module/build/outputs/apk/release/app-release-unsigned.apk" "$RUNNER_TEMP/$app_name-$APP_VERSION-unsigned.apk"
        env:
          APP_VERSION: ${{ steps.extract_version.outputs.APP_VERSION }}

      # Create Bundle AAB Release
      # Noted for main module build [main_project_module]:bundleRelease
      # - name: Build app bundle release (AAB) - ${{ env.main_project_module }} module
      #   run: ./gradlew ${{ env.main_project_module }}:bundleRelease

      # Upload Artifact Build
      # Noted For Output [main_project_module]/build/outputs/apk/debug/
      - name: Upload APK Debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - APK(s) debug generated
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/

      # Only for `sign` to pick up. The signed APK goes out under the usual artifact name from there.
      - name: Upload the unsigned release APK for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-apk
          path: ${{ runner.temp }}/${{ env.app_name }}-${{ steps.extract_version.outputs.APP_VERSION }}-unsigned.apk
          if-no-files-found: error
          retention-days: 1

      # Noted For Output [main_project_module]/build/outputs/bundle/release/
      # - name: Upload AAB (App Bundle) Release - ${{ env.repository_name }}
      #   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      #   with:
      #     name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - App bundle(s) AAB release generated
      #     path: ${{ env.main_project_module }}/build/outputs/bundle/release/

  # The only job that ever holds the release key. Keep it that way: no checkout, no setup actions,
  # no Gradle, no pip. What runs here is the runner image's own Android SDK and two GitHub-owned
  # artifact actions, and nothing the repository or a dependency could have changed.
  sign:
    needs: build
    environment: 'Android Build Release'
    runs-on: ubuntu-latest

    # Nothing. Artifacts from this run need no token permission, and this job writes nowhere else.
    permissions: {}

    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}

      # The certificate every release so far has been signed with (1.2.0 and before). Checked after
      # signing, because an APK signed by any other key will not install over an existing one, and
      # the person who finds that out is a user being told to uninstall, which destroys their
      # imported tags and history. Only change this if the release key is deliberately rotated.
      EXPECTED_SIGNER_SHA256: e85e6f91cb4b58102ef7476e7193e7fae25cfb46c9f0425d8aced117a12ecf92

    steps:
      - name: Download the unsigned release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-apk
          path: ${{ runner.temp }}/unsigned

      # Build-tools comes with the runner image, not from anything this workflow fetched. The newest
      # installed one is used; -P (16 KB page alignment) needs 35.0.0 or later.
      - name: Find the Android build-tools
        run: |
          set -euo pipefail
          version=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          test -n "$version"
          echo "Using build-tools $version"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$version" >> "$GITHUB_ENV"

      # AGP aligns the APK when it packages it, including 16 KB page alignment for the native
      # libraries it stores uncompressed. apksigner keeps the alignment it is given, and a v2 signature
      # is a block outside the zip entries, so checking it here and again afterwards is enough.
      - name: Check the unsigned APK is aligned
        run: |
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/unsigned/$app_name-$APP_VERSION-unsigned.apk"

      # The keystore exists only for the length of this step, outside the workspace, readable only
      # by the runner user. The passwords are handed to apksigner through the environment, never on
      # its command line.
      #
      # v2 only, which is what AGP signed every earlier release with for minSdk 24: v1 is only
      # needed below API 24, and v3 adds nothing without a key rotation. Matching it keeps the
      # APK the same shape as before rather than changing two things at once.
      - name: Sign the release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release-keystore.jks"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$SIGNING_KEY" | base64 --decode > "$keystore")
          mkdir -p "$RUNNER_TEMP/signed"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out "$RUNNER_TEMP/signed/$app_name-$APP_VERSION.apk" \
            "$RUNNER_TEMP/unsigned/$app_name-$APP_VERSION-unsigned.apk"

      - name: Verify the signature, the signer and the alignment
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/signed/$app_name-$APP_VERSION.apk"
          report=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk")
          echo "$report" | grep -v '^WARNING'
          echo "$report" | grep -qx 'Verified using v2 scheme (APK Signature Scheme v2): true'
          echo "$report" | grep -qx 'Number of signers: 1'
          if ! echo "$report" | grep -qx "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256"; then
            echo "::error::The APK is not signed by the release certificate ($EXPECTED_SIGNER_SHA256). It would not install over an existing release, so it is not being published."
            exit 1
          fi
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"
          {
            echo "### Signed $app_name $APP_VERSION"
            echo
            echo '```'
            (cd "$RUNNER_TEMP/signed" && sha256sum "$app_name-$APP_VERSION.apk")
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK Release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.release_artifact }}
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error

  # Attaches the signed APK to the release. No environment and no key; it needs only this run's own
  # token with write access to releases, which is what `permissions` grants below.
  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the signed release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.release_artifact }}
          path: signed

      # The APK carries libmacadi.so, which links Unicorn (GPL-2.0). GPL-2.0 section 3 asks for the
      # corresponding source to be offered from the same place as the binary, and FetchContent
      # downloads Unicorn's at build time rather than it being in this repository's tag. So the
      # exact tarball the build used goes on the release beside the APK, checked against the hash
      # MacAdi.cmake pins, and the APK's assets/licences/unicorn/NOTICE.txt says where it is.
      - name: Fetch Unicorn's source, as the APK was built from it
        run: |
          url=$(sed -n 's/^ *URL \(https:[^ ]*unicorn[^ ]*\.tar\.gz\)$/\1/p' app/src/main/cpp/macadi/MacAdi.cmake)
          sha=$(sed -n 's/^ *URL_HASH SHA256=\([0-9a-f]*\).*/\1/p' app/src/main/cpp/macadi/MacAdi.cmake)
          test -n "$url" && test -n "$sha"
          curl -sSfL "$url" -o "unicorn-$(basename "$url")"
          echo "$sha  unicorn-$(basename "$url")" | sha256sum -c -
          echo "UNICORN_SOURCE=unicorn-$(basename "$url")" >> "$GITHUB_ENV"

      # `gh` is on the runner image, so this needs no third-party action and no personal access
      # token: the job's own token, granted contents: write above, is enough to upload assets and
      # set the title. --clobber replaces an asset of the same name, so re-running a failed release
      # works. The title is the one releases have always ended up with, without the `v`.
      - name: Upload APK Release Asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "signed/$app_name-$APP_VERSION.apk" "$UNICORN_SOURCE" \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --title "$app_name Android App $APP_VERSION" --repo "$GITHUB_REPOSITORY"
