name: Generate APK (Release)
env:
  # The name of the main module repository
  main_project_module: app
  # The name of the App
  app_name: OpenTagViewer
  KEYSTORE_FILE: release-keystore.jks
  ALIAS: upload

on:
  release:
    types: published

jobs:
  build:
    environment: 'Android Build Release'
    runs-on: ubuntu-latest

    # Only run this for 'android-app-v<whatever>' tags!
    if: |
      github.event_name == 'release'
      && (github.event.release.prerelease == true || github.event.release.published_at != null)
      && startsWith(github.event.release.tag_name, 'android-app-v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Nothing rewrites versionName from the tag: it is what the app reports about itself in
      # Settings and in bug reports, and it is baked into the APK. So a tag that disagrees
      # with app/build.gradle.kts publishes an APK calling itself the old version, under a
      # release page claiming the new one, and nothing anywhere says so.
      #
      # This replaces parsing the tag by hand. The version now comes from the source and the
      # tag only has to agree with it, which is the same arrangement the macOS exporter has
      # used since scripts/release_version.py was introduced. It runs before the Gradle build,
      # so a mismatch costs seconds rather than a full signed build.
      - name: Check the release tag matches the version in the source
        id: extract_version
        run: |
          APP_VERSION="$(python3 scripts/release_version.py --kind android --tag "${{ github.ref }}")"
          echo "Tag and source agree on version: $APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

      # Set Current Date As Env Variable
      - name: Set current date as env variable
        run: echo "date_today=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # Set Repository Name As Env Variable
      - name: Set repository name as env variable
        run: echo "repository_name=$(echo '${{ github.repository }}' | awk -F '/' '{print $2}')" >> $GITHUB_ENV

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew


      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Inject secrets.properties
        run: |
          echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > secrets.properties

      - name: Recreate release keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ env.main_project_module }}/${{ env.KEYSTORE_FILE }}

      # No stub wheel to validate any more: it is generated from app/stubs/unicorn/ by
      # generateUnicornStubWheel during the build, rather than being checked in.

      # A release is the worst time to discover a locale is missing a string, since the
      # fallback is silent: those users simply get English.
      - name: Check every locale has every string
        run: python3 scripts/add_strings.py --check

      - name: Run gradle tests
        run: ./gradlew test

      # Covers app/src/main/python, the module Chaquopy packages into the APK.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chaquopy bridge test dependencies
        run: python -m pip install -r app/src/test/python/requirements.txt

      - name: Run Chaquopy bridge tests
        run: python -m pytest app/src/test/python -v

      - name: Build gradle project
        run: ./gradlew build -x lint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK Debug
        run: |
          ./gradlew assembleDebug
          # rename debug build
          mv ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk ${{ env.main_project_module }}/build/outputs/apk/debug/${{ env.app_name }}-${{ steps.extract_version.outputs.APP_VERSION }}-debug.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build APK Release
        run: |
          ./gradlew assembleRelease
          # rename release build
          mv ${{ env.main_project_module }}/build/outputs/apk/release/app-release.apk ${{ env.main_project_module }}/build/outputs/apk/release/${{ env.app_name }}-${{ steps.extract_version.outputs.APP_VERSION }}.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # Create Bundle AAB Release
      # Noted for main module build [main_project_module]:bundleRelease
      # - name: Build app bundle release (AAB) - ${{ env.main_project_module }} module
      #   run: ./gradlew ${{ env.main_project_module }}:bundleRelease

      # Upload Artifact Build
      # Noted For Output [main_project_module]/build/outputs/apk/debug/
      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - APK(s) debug generated
          path: ${{ env.main_project_module }}/build/outputs/apk/debug/

      # Noted For Output [main_project_module]/build/outputs/apk/release/
      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - APK(s) release generated
          path: ${{ env.main_project_module }}/build/outputs/apk/release/

      - name: Upload APK Release Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: ${{ env.main_project_module }}/build/outputs/apk/release/${{ env.app_name }}-${{ steps.extract_version.outputs.APP_VERSION }}.apk
          name: ${{ env.app_name }} Android App ${{ steps.extract_version.outputs.APP_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.ANDROID_BUILD_RELEASE_GITHUB_TOKEN }}

      # Noted For Output [main_project_module]/build/outputs/bundle/release/
      # - name: Upload AAB (App Bundle) Release - ${{ env.repository_name }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ${{ env.date_today }} - ${{ env.app_name }} - ${{ env.repository_name }} - App bundle(s) AAB release generated
      #     path: ${{ env.main_project_module }}/build/outputs/bundle/release/
