# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: MacOS Exporter App

on:
  release:
    types: published

env:
  PYTHONPATH: "${{ github.workspace }}/python:$PYTHONPATH"
  PYINSTALLER_PYTHON_VER: 3.13
  APP_NAME: OpenTagViewer-ExportWizardMacOS

jobs:
  test-release-version:
    runs-on: macos-14

    # Only run this for 'macos-exporter-v<whatever>' tags!
    if: |
      github.event_name == 'release'
      && (github.event.release.prerelease == true || github.event.release.published_at != null)
      && startsWith(github.event.release.tag_name, 'macos-exporter-v')

    # The version both build jobs name their artifacts with. It comes from here rather than
    # from each job parsing the tag again, so there is exactly one place it can be wrong.
    outputs:
      app-version: ${{ steps.version.outputs.APP_VERSION }}

    steps: # (reuses steps from full flow!)
    - name: Checkout code
      uses: actions/checkout@v4

    # Nothing in this pipeline rewrites VERSION in python/main/wizard.py: the tag names the
    # artifact, and the app keeps whatever was committed. So a tag that disagrees with the
    # source ships a build that calls itself the old version in its title bar and in the
    # `via:` field of every export it writes. This step is what makes that a failed release
    # instead of a confusing zip. It runs before either build job (they `need` this one), so
    # a mismatch costs one minute rather than two full PyInstaller builds.
    #
    # Deliberately not the reverse - patching the tag into the source - because the wizard
    # also runs from source, and those exports stamp `via:` too. See scripts/exporter_version.py.
    - name: Check the release tag matches the version in the source
      id: version
      run: |
        APP_VERSION="$(python3 scripts/exporter_version.py --tag "${{ github.ref }}")"
        echo "Tag and source agree on version: $APP_VERSION"
        echo "APP_VERSION=$APP_VERSION" >> $GITHUB_OUTPUT

    # Do everything strictly for the python version used in the release build...
    - name: Set up Python ${{ env.PYINSTALLER_PYTHON_VER }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYINSTALLER_PYTHON_VER }}

    - name: Install dependencies
      working-directory: ./python
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        pip install -r requirements.txt

    - name: Lint with flake8
      working-directory: . # run flake8 from repository root
      run: |
        # Run flake8 on the 'python' directory, letting it pick up the .flake8 config file
        # stop the build if there are Python syntax errors or undefined names
        flake8 ./python --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 ./python --count --exit-zero --statistics

    - name: Test with pytest
      working-directory: ./python
      run: |
        pytest ./test

# !!!!!
#
#   YES, THESE ARE DUPLICATED.
#   I COULD NOT FIND A BETTER SOLUTION FOR THIS.
#
#   THERE IS SOME KIND OF SCHEDULING PROBLEM WHERE
#   IF YOU PROVIDE THEM BOTH IN 'RUNS-ON', THE JOB
#   JUST STRAIGHT UP WILL NEVER START (AT LEAST NOT
#   FOR 20 MINS).
#
#   SEPARATING THEM FIXES IT.
#
#   - YAML ANCHORS ARE NOT SUPPORTED BY GITHUB.
#   - WORKFLOWS MESS UP PERMISSIONS.
#
#   SO YES WE WILL HAVE TO TAKE THE DUPLICATION.
#   UNTIL WE GET BETTER OPTIONS.
#
# !!!!!

  build-apple-silicon:
    needs: test-release-version
    runs-on: macos-14 # Apple Silicon
    environment: 'MacOS Exporter App CI'

    # The repository default is read-only, which is what turned a missing token into a 403 at
    # the very last step. Granting it here means the upload still works if the PAT is ever
    # unset or expires - the action treats an empty token as unset and falls back to this one.
    permissions:
      contents: write

    # Only run this for 'macos-exporter-v<whatever>' tags!
    if: |
      github.event_name == 'release'
      && (github.event.release.prerelease == true || github.event.release.published_at != null)
      && startsWith(github.event.release.tag_name, 'macos-exporter-v')

    # The version is not parsed out of the tag here. It is whatever test-release-version
    # confirmed the tag and python/main/wizard.py agree on, so the zip name, the release
    # name, and the version the app reports about itself cannot come apart.
    env:
      APP_VERSION: ${{ needs.test-release-version.outputs.app-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYINSTALLER_PYTHON_VER }} (${{ runner.arch }})
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYINSTALLER_PYTHON_VER }}

    - name: Install dependencies
      working-directory: ./python
      run: |
        brew install python-tk
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

    - name: Run PyInstaller for MacOS (${{ runner.arch }})
      working-directory: ./python
      run: |
        pyinstaller \
          --onefile \
          --windowed \
          --name "OpenTagViewer" \
          --osx-bundle-identifier "dev.wander.opentagviewer" \
          --icon=OpenTagViewer.icns \
          --noconfirm \
          ./main/wizard.py

    - name: Prepare and Upload MacOS App
      working-directory: ./python
      run: |
        echo "Going to build zip with version: $APP_VERSION"
        APP_ZIP_NAME="${{ env.APP_NAME }}-$APP_VERSION-${{ runner.arch }}.zip"
        cd ./dist
        zip -r $APP_ZIP_NAME OpenTagViewer.app/ OpenTagViewer
        mkdir -p ${{ github.workspace }}/output
        mv ${{ github.workspace }}/python/dist/$APP_ZIP_NAME ${{ github.workspace }}/output/$APP_ZIP_NAME

        echo "UPLOAD_ASSET=$APP_ZIP_NAME" >> $GITHUB_ENV
        echo "UPLOAD_PATH=${{ github.workspace }}/output/$APP_ZIP_NAME" >> $GITHUB_ENV

    - name: Upload PyInstaller Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ runner.arch }}.zip
        path: ${{ github.workspace }}/output/${{ env.APP_NAME }}-${{ env.APP_VERSION }}-${{ runner.arch }}.zip

    # The token goes in `with:`, not `env:`. This action's `token` input defaults to
    # ${{ github.token }}, and its own docs say "a non-empty explicit token overrides
    # GITHUB_TOKEN" - so the default is always non-empty and the env var was ignored
    # entirely. It authenticated as the built-in token, whose contents permission is read-only
    # here, and failed with 403 "Resource not accessible by integration" after both binaries
    # had already been built. The v1.0.5 release published with no assets attached.
    - name: Upload Release Asset to GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release'
      with:
        files: ${{ env.UPLOAD_PATH }} # Path to asset created in previous step
        name: OpenTagViewer MacOS AirTag Exporter ${{ env.APP_VERSION }}
        token: ${{ secrets.MACOS_EXPORTER_APP_GITHUB_TOKEN }}

  build-intel:
    needs: test-release-version
    runs-on: macos-13 # Intel
    environment: 'MacOS Exporter App CI'

    # The repository default is read-only, which is what turned a missing token into a 403 at
    # the very last step. Granting it here means the upload still works if the PAT is ever
    # unset or expires - the action treats an empty token as unset and falls back to this one.
    permissions:
      contents: write

        # Only run this for 'macos-exporter-v<whatever>' tags!
    if: |
      github.event_name == 'release'
      && (github.event.release.prerelease == true || github.event.release.published_at != null)
      && startsWith(github.event.release.tag_name, 'macos-exporter-v')

    # The version is not parsed out of the tag here. It is whatever test-release-version
    # confirmed the tag and python/main/wizard.py agree on, so the zip name, the release
    # name, and the version the app reports about itself cannot come apart.
    env:
      APP_VERSION: ${{ needs.test-release-version.outputs.app-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ env.PYINSTALLER_PYTHON_VER }} (${{ runner.arch }})
      uses: actions/setup-python@v3
      with:
        python-version: ${{ env.PYINSTALLER_PYTHON_VER }}

    - name: Install dependencies
      working-directory: ./python
      run: |
        brew install python-tk
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

