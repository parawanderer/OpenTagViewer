# main reference for public anisette servers: https://github.com/SideStore/anisette-servers/blob/main/servers.json
# (app will also try to dynamically fetch these from github when user goes to settings page)
defaultAnisetteUrl=https://ani.sidestore.io
projectGithub=https://github.com/parawanderer/OpenTagViewer
projectWiki=https://github.com/parawanderer/OpenTagViewer/wiki
# Linked from the AMap API key dialog, since users have to register their own key
amapWikiPage=https://github.com/parawanderer/OpenTagViewer/wiki/%5BMaps%5D-How-To:-Use-AMap-(%E9%AB%98%E5%BE%B7%E5%9C%B0%E5%9B%BE)
# Linked from the empty state on the device list: the export happens on a Mac, so a new user
# with no devices has no way to get one from inside the app
exportWikiPage=https://github.com/parawanderer/OpenTagViewer/wiki/How-To:-Get-AirTags-into-App
# Linked from the Anisette section in Settings when a remote server is selected, for anyone
# wanting to know what an Anisette server is before trusting one with their sign-ins
anisetteWikiPage=https://github.com/parawanderer/OpenTagViewer/wiki/%5BAnisette%5D-Overview
# Linked when Apple has replaced the Apple Music APK that local Anisette reads its libraries
# from, and the user has to supply a copy of the known-good build themselves
anisetteApkWikiPage=https://github.com/parawanderer/OpenTagViewer/wiki/%5BAnisette%5D-Overview#supplying-your-own-apple-music-apk
# Linked from the tag page when nothing recognises an accessory: its vendor id is a real
# Bluetooth SIG company identifier, and the registry is where anyone can settle what it is
bluetoothSigAssignedNumbers=https://www.bluetooth.com/specifications/assigned-numbers/
